<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8faf7"/>
      <stop offset="100%" stop-color="#eef6f3"/>
    </linearGradient>
    <linearGradient id="headerGreen" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="headerAmber" x1="0" x2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .table-title { font: 700 22px Arial, sans-serif; fill: #fff; letter-spacing: .2px; }
      .field { font: 400 16px Arial, sans-serif; fill: #172033; }
      .field-strong { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .badge { font: 700 11px Arial, sans-serif; fill: #fff; }
      .type { font: 400 13px Arial, sans-serif; fill: #64748b; }
      .relation { font: 700 15px Arial, sans-serif; fill: #0f766e; }
      .note { font: 400 15px Arial, sans-serif; fill: #475569; }
      .connector { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-blue { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #d8e2dc; stroke-width: 1.2; rx: 18; filter: url(#shadow); }
      .header { rx: 18; }
      .row-line { stroke: #e7ece8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="url(#bg)"/>
  <path d="M0 84 H1600 M0 168 H1600 M0 252 H1600 M0 336 H1600 M0 420 H1600 M0 504 H1600 M0 588 H1600 M0 672 H1600 M0 756 H1600 M0 840 H1600 M0 924 H1600 M0 1008 H1600" stroke="#e8eee9" stroke-width="1"/>
  <path d="M96 0 V1160 M192 0 V1160 M288 0 V1160 M384 0 V1160 M480 0 V1160 M576 0 V1160 M672 0 V1160 M768 0 V1160 M864 0 V1160 M960 0 V1160 M1056 0 V1160 M1152 0 V1160 M1248 0 V1160 M1344 0 V1160 M1440 0 V1160 M1536 0 V1160" stroke="#edf3ef" stroke-width="1"/>

  <text x="80" y="70" class="title">ecommerce_portal Veritabanı İlişki Şeması</text>
  <text x="80" y="104" class="subtitle">Java MVC E-Ticaret Portalı için tablo alanları, primary key / foreign key bilgileri ve 1-N ilişkiler</text>

  <!-- USERS -->
  <g transform="translate(80 160)">
    <rect class="card" width="360" height="330"/>
    <path class="header" d="M0 18 Q0 0 18 0 H342 Q360 0 360 18 V66 H0 Z" fill="url(#headerGreen)"/>
    <text x="24" y="42" class="table-title">users</text>
    <g transform="translate(24 88)">
      <rect x="0" y="-17" width="31" height="20" rx="10" fill="#0f766e"/><text x="8" y="-3" class="badge">PK</text>
      <text x="44" y="0" class="field-strong">id</text><text x="222" y="0" class="type">INT</text>
      <line class="row-line" x1="0" y1="18" x2="312" y2="18"/>
      <text x="44" y="44" class="field">full_name</text><text x="222" y="44" class="type">VARCHAR(120)</text>
      <line class="row-line" x1="0" y1="62" x2="312" y2="62"/>
      <text x="44" y="88" class="field">email</text><text x="222" y="88" class="type">VARCHAR(150), UNIQUE</text>
      <line class="row-line" x1="0" y1="106" x2="312" y2="106"/>
      <text x="44" y="132" class="field">password</text><text x="222" y="132" class="type">VARCHAR(255)</text>
      <line class="row-line" x1="0" y1="150" x2="312" y2="150"/>
      <text x="44" y="176" class="field">phone</text><text x="222" y="176" class="type">VARCHAR(30)</text>
      <line class="row-line" x1="0" y1="194" x2="312" y2="194"/>
      <text x="44" y="220" class="field">address</text><text x="222" y="220" class="type">TEXT</text>
      <line class="row-line" x1="0" y1="238" x2="312" y2="238"/>
      <text x="44" y="264" class="field">role</text><text x="222" y="264" class="type">VARCHAR(20)</text>
    </g>
  </g>

  <!-- CATEGORIES -->
  <g transform="translate(80 610)">
    <rect class="card" width="360" height="240"/>
    <path class="header" d="M0 18 Q0 0 18 0 H342 Q360 0 360 18 V66 H0 Z" fill="url(#headerBlue)"/>
    <text x="24" y="42" class="table-title">categories</text>
    <g transform="translate(24 88)">
      <rect x="0" y="-17" width="31" height="20" rx="10" fill="#1d4ed8"/><text x="8" y="-3" class="badge">PK</text>
      <text x="44" y="0" class="field-strong">id</text><text x="218" y="0" class="type">INT</text>
      <line class="row-line" x1="0" y1="18" x2="312" y2="18"/>
      <text x="44" y="44" class="field">name</text><text x="218" y="44" class="type">VARCHAR(100)</text>
      <line class="row-line" x1="0" y1="62" x2="312" y2="62"/>
      <text x="44" y="88" class="field">description</text><text x="218" y="88" class="type">TEXT</text>
      <line class="row-line" x1="0" y1="106" x2="312" y2="106"/>
      <text x="44" y="132" class="field">is_active</text><text x="218" y="132" class="type">BOOLEAN</text>
    </g>
  </g>

  <!-- PRODUCTS -->
  <g transform="translate(610 520)">
    <rect class="card" width="390" height="500"/>
    <path class="header" d="M0 18 Q0 0 18 0 H372 Q390 0 390 18 V66 H0 Z" fill="url(#headerBlue)"/>
    <text x="24" y="42" class="table-title">products</text>
    <g transform="translate(24 88)">
      <rect x="0" y="-17" width="31" height="20" rx="10" fill="#1d4ed8"/><text x="8" y="-3" class="badge">PK</text>
      <text x="44" y="0" class="field-strong">id</text><text x="238" y="0" class="type">INT</text>
      <line class="row-line" x1="0" y1="18" x2="342" y2="18"/>
      <rect x="0" y="27" width="31" height="20" rx="10" fill="#2563eb"/><text x="8" y="41" class="badge">FK</text>
      <text x="44" y="44" class="field-strong">category_id</text><text x="238" y="44" class="type">INT → categories.id</text>
      <line class="row-line" x1="0" y1="62" x2="342" y2="62"/>
      <text x="44" y="88" class="field">name</text><text x="238" y="88" class="type">VARCHAR(160)</text>
      <line class="row-line" x1="0" y1="106" x2="342" y2="106"/>
      <text x="44" y="132" class="field">description</text><text x="238" y="132" class="type">TEXT</text>
      <line class="row-line" x1="0" y1="150" x2="342" y2="150"/>
      <text x="44" y="176" class="field">price</text><text x="238" y="176" class="type">DECIMAL(10,2)</text>
      <line class="row-line" x1="0" y1="194" x2="342" y2="194"/>
      <text x="44" y="220" class="field">stock</text><text x="238" y="220" class="type">INT</text>
      <line class="row-line" x1="0" y1="238" x2="342" y2="238"/>
      <text x="44" y="264" class="field">image_url</text><text x="238" y="264" class="type">VARCHAR(600)</text>
      <line class="row-line" x1="0" y1="282" x2="342" y2="282"/>
      <text x="44" y="308" class="field">is_active</text><text x="238" y="308" class="type">BOOLEAN</text>
      <line class="row-line" x1="0" y1="326" x2="342" y2="326"/>
      <text x="44" y="352" class="field">created_at</text><text x="238" y="352" class="type">TIMESTAMP</text>
    </g>
  </g>

  <!-- ORDERS -->
  <g transform="translate(610 160)">
    <rect class="card" width="390" height="280"/>
    <path class="header" d="M0 18 Q0 0 18 0 H372 Q390 0 390 18 V66 H0 Z" fill="url(#headerAmber)"/>
    <text x="24" y="42" class="table-title">orders</text>
    <g transform="translate(24 88)">
      <rect x="0" y="-17" width="31" height="20" rx="10" fill="#b45309"/><text x="8" y="-3" class="badge">PK</text>
      <text x="44" y="0" class="field-strong">id</text><text x="235" y="0" class="type">INT</text>
      <line class="row-line" x1="0" y1="18" x2="342" y2="18"/>
      <rect x="0" y="27" width="31" height="20" rx="10" fill="#d97706"/><text x="8" y="41" class="badge">FK</text>
      <text x="44" y="44" class="field-strong">user_id</text><text x="235" y="44" class="type">INT → users.id</text>
      <line class="row-line" x1="0" y1="62" x2="342" y2="62"/>
      <text x="44" y="88" class="field">order_date</text><text x="235" y="88" class="type">TIMESTAMP</text>
      <line class="row-line" x1="0" y1="106" x2="342" y2="106"/>
      <text x="44" y="132" class="field">total_amount</text><text x="235" y="132" class="type">DECIMAL(10,2)</text>
      <line class="row-line" x1="0" y1="150" x2="342" y2="150"/>
      <text x="44" y="176" class="field">status</text><text x="235" y="176" class="type">VARCHAR(40)</text>
    </g>
  </g>

  <!-- ORDER ITEMS -->
  <g transform="translate(1130 330)">
    <rect class="card" width="390" height="340"/>
    <path class="header" d="M0 18 Q0 0 18 0 H372 Q390 0 390 18 V66 H0 Z" fill="url(#headerGreen)"/>
    <text x="24" y="42" class="table-title">order_items</text>
    <g transform="translate(24 88)">
      <rect x="0" y="-17" width="31" height="20" rx="10" fill="#0f766e"/><text x="8" y="-3" class="badge">PK</text>
      <text x="44" y="0" class="field-strong">id</text><text x="232" y="0" class="type">INT</text>
      <line class="row-line" x1="0" y1="18" x2="342" y2="18"/>
      <rect x="0" y="27" width="31" height="20" rx="10" fill="#0d9488"/><text x="8" y="41" class="badge">FK</text>
      <text x="44" y="44" class="field-strong">order_id</text><text x="232" y="44" class="type">INT → orders.id</text>
      <line class="row-line" x1="0" y1="62" x2="342" y2="62"/>
      <rect x="0" y="71" width="31" height="20" rx="10" fill="#0d9488"/><text x="8" y="85" class="badge">FK</text>
      <text x="44" y="88" class="field-strong">product_id</text><text x="232" y="88" class="type">INT → products.id</text>
      <line class="row-line" x1="0" y1="106" x2="342" y2="106"/>
      <text x="44" y="132" class="field">quantity</text><text x="232" y="132" class="type">INT</text>
      <line class="row-line" x1="0" y1="150" x2="342" y2="150"/>
      <text x="44" y="176" class="field">unit_price</text><text x="232" y="176" class="type">DECIMAL(10,2)</text>
      <line class="row-line" x1="0" y1="194" x2="342" y2="194"/>
      <text x="44" y="220" class="field">subtotal</text><text x="232" y="220" class="type">DECIMAL(10,2)</text>
    </g>
  </g>

  <!-- RELATION LINES -->
  <path class="connector" d="M440 270 C510 270 530 270 610 270"/>
  <text x="468" y="252" class="relation">1</text>
  <text x="578" y="252" class="relation">N</text>

  <path class="connector-blue" d="M440 730 C520 730 535 686 610 686"/>
  <text x="468" y="712" class="relation">1</text>
  <text x="578" y="712" class="relation">N</text>

  <path class="connector" d="M1000 300 C1070 300 1075 430 1130 430"/>
  <text x="1018" y="286" class="relation">1</text>
  <text x="1095" y="414" class="relation">N</text>

  <path class="connector" d="M1000 700 C1070 700 1070 500 1130 500"/>
  <text x="1018" y="714" class="relation">1</text>
  <text x="1095" y="523" class="relation">N</text>

  <g transform="translate(80 1070)">
    <rect width="1440" height="55" rx="16" fill="#ffffff" stroke="#d8e2dc"/>
    <circle cx="28" cy="27" r="8" fill="#0f766e"/>
    <text x="48" y="33" class="note">PK: Primary Key</text>
    <circle cx="205" cy="27" r="8" fill="#2563eb"/>
    <text x="225" y="33" class="note">FK: Foreign Key</text>
    <text x="420" y="33" class="note">İlişkiler: Kullanıcı 1-N Sipariş, Kategori 1-N Ürün, Sipariş 1-N Sipariş Kalemi, Ürün 1-N Sipariş Kalemi</text>
  </g>
</svg>
